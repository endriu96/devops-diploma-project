global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "172.17.0.1:9093"

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  - job_name: "devops-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["172.17.0.1:5000"]
        labels:
          app: "devops-app"